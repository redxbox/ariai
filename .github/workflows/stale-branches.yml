name: Prune stale arena branches

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-stale-branches:
    name: Delete abandoned arena/* branches
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete arena branches idle for 30+ days without an open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(( $(date -u +%s) - 30 * 24 * 60 * 60 ))
          git fetch --prune origin
          deleted=0
          while read -r ref ts; do
            [ -n "${ref:-}" ] || continue
            branch="${ref#origin/}"
            if [ "$ts" -ge "$cutoff" ]; then
              echo "Keeping $branch (commit newer than 30 days)."
              continue
            fi
            open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
            if [ "$open" != "0" ]; then
              echo "Keeping $branch ($open open pull request(s))."
              continue
            fi
            echo "Deleting stale branch $branch."
            git push origin --delete "$branch"
            deleted=$(( deleted + 1 ))
          done < <(git for-each-ref --format='%(refname:short) %(committerdate:unix)' 'refs/remotes/origin/arena/*' || true)
          echo "Deleted $deleted stale arena branch(es)."
