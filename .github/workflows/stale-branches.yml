name: Report stale arena branches

# Report only. This workflow never deletes branches. Remove a branch by hand after checking it.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report-stale-branches:
    name: List arena/* branches idle for 30+ days
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List idle arena branches (nothing is deleted)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(( $(date -u +%s) - 30 * 24 * 60 * 60 ))
          git fetch --prune origin
          {
            echo "### Idle arena branches (report only)"
            echo ""
            echo "Nothing is deleted by this job. Check each branch before removing it by hand."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          while read -r ref ts; do
            [ -n "${ref:-}" ] || continue
            branch="${ref#origin/}"
            if [ "$ts" -ge "$cutoff" ]; then
              continue
            fi
            open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
            merged="no"
            if git merge-base --is-ancestor "$ref" origin/main 2>/dev/null; then merged="yes"; fi
            echo "- \`$branch\`: last commit $(date -u -d "@$ts" +%Y-%m-%d), open PRs: $open, merged into main: $merged" >> "$GITHUB_STEP_SUMMARY"
            found=$(( found + 1 ))
          done < <(git for-each-ref --format='%(refname:short) %(committerdate:unix)' 'refs/remotes/origin/arena/*' || true)
          echo "- Idle branches found: $found" >> "$GITHUB_STEP_SUMMARY"
          echo "Idle arena branches found: $found (report only)."
