name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Validate app and build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check Persian translation coverage
        run: python3 .github/scripts/check_translations.py

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Run release lint
        env:
          LINT_PRINT_STACKTRACE: "true"
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace 2>&1 | tee release-lint.log

      - name: Assemble release variant (R8 and resource shrinking)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee release-build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report Android validation errors
        if: failure()
        run: |
          pattern='^e: |error:|What went wrong|Execution failed|FAILED|Failure|AssertionError|expected:|but was:|Tests run:|There were failing tests|Caused by:'
          for log in unit-tests.log release-lint.log release-build.log build.log; do
            [ -s "$log" ] || continue
            summary=$(grep -E "$pattern" "$log" | tail -15 | tr '\r\n' '  ' | cut -c1-3000 || true)
            final_context=$(tail -35 "$log" | tr '\r\n' '  ' | cut -c1-3000)
            if [ "$log" = "release-lint.log" ]; then
              lint_details=$(grep -E 'Message:|Unexpected failure|Lint found an issue|Caused by:|Exception:' "$log" | head -12 | tr '\r\n' '  ' | cut -c1-1400 || true)
              final_context=$(tail -8 "$log" | tr '\r\n' '  ' | cut -c1-700)
              echo "::error title=Gradle diagnostics::$log | lint details: $lint_details | $summary | final log context: $final_context"
            else
              echo "::error title=Gradle diagnostics::$log | $summary | final log context: $final_context"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results = Path("app/build/test-results/testDebugUnitTest")
          for report in results.glob("TEST-*.xml"):
              try:
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      message = " ".join(
                          f"{failure.attrib.get('message', '')} {failure.text or ''}".split()
                      )[:900]
                      if message:
                          name = f"{case.attrib.get('classname', 'unknown')}.{case.attrib.get('name', 'unknown')}"
                          print(f"::error title=JVM unit test failure::{name}: {message}")
          PY

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ariai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ariai-validation-logs
          path: |
            build.log
            unit-tests.log
            release-lint.log
            release-build.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add install instructions to run summary
        if: success()
        run: |
          {
            echo '## Install AriAI'
            echo 'Download the **ariai-debug-apk** artifact from this workflow run, unzip it, and install `app-debug.apk` on your Android device.'
            echo 'Android may ask you to allow installation from your browser or file manager.'
          } >> "$GITHUB_STEP_SUMMARY"
