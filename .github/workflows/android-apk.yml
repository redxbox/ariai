name: Android APK

on:
  push:
    branches:
      - arena/5f5dd5fd-ariai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Validate app and build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Check Persian translation coverage
        run: python3 .github/scripts/check_translations.py

      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Run release lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace 2>&1 | tee release-lint.log

      - name: Assemble release variant (R8 and resource shrinking)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee release-build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report debug APK build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E '^e: |error:|What went wrong|Execution failed|\* What went wrong:' build.log | head -30 | while IFS= read -r line; do
              safe=$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)
              echo "::error title=Gradle build error::$safe"
            done
            echo "::notice title=Gradle build tail::$(tail -n 30 build.log | tr '\n' ' ' | cut -c1-3000)"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ariai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ariai-validation-logs
          path: |
            build.log
            unit-tests.log
            release-lint.log
            release-build.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add install instructions to run summary
        if: success()
        run: |
          {
            echo '## Install AriAI'
            echo 'Download the **ariai-debug-apk** artifact from this workflow run, unzip it, and install `app-debug.apk` on your Android device.'
            echo 'Android may ask you to allow installation from your browser or file manager.'
          } >> "$GITHUB_STEP_SUMMARY"
