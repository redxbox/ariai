name: Android APK

on:
  push:
    branches:
      - arena/5f5dd5fd-ariai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ariai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Add install instructions to run summary
        run: |
          {
            echo '## Install AriAI'
            echo 'Download the **ariai-debug-apk** artifact from this workflow run, unzip it, and install `app-debug.apk` on your Android device.'
            echo 'Android may ask you to allow installation from your browser or file manager.'
          } >> "$GITHUB_STEP_SUMMARY"
