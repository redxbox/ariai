name: Release APK and Signed AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate tag against app versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version_name="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "versionName=$version_name tag=$GITHUB_REF_NAME"
          case "$version_name" in
            "$tag_version"|"$tag_version"*)
              echo "Tag matches versionName."
              ;;
            *)
              echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$version_name'. Bump versionName/versionCode in app/build.gradle.kts first, then retag."
              exit 1
              ;;
          esac

      - name: Run unit tests and release lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease --stacktrace 2>&1 | tee validation.log

      - name: Build signed release APK and App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo '::error::Missing Android keystore secret. Configure ANDROID_KEYSTORE_BASE64 (or a documented alias).'
            missing=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo '::error::Missing Android keystore-password secret. Configure ANDROID_KEYSTORE_PASSWORD (or a documented alias).'
            missing=1
          fi
          if [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo '::error::Missing Android key-alias secret. Configure ANDROID_KEY_ALIAS (or a documented alias).'
            missing=1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo '::error::Missing Android key-password secret. Configure ANDROID_KEY_PASSWORD (or a documented alias).'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

          keystore="$RUNNER_TEMP/ariai-release-keystore.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          export ARIAI_RELEASE_KEYSTORE_FILE="$keystore"
          export ARIAI_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ARIAI_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export ARIAI_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee release-build.log

          apk='app/build/outputs/apk/release/app-release.apk'
          bundle='app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$bundle"

          # Validate both signatures before anything is published.
          verify_out="$(jarsigner -verify "$bundle" 2>&1 || true)"
          printf '%s\n' "$verify_out"
          grep -q 'jar verified' <<<"$verify_out"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner_bin="$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          test -n "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$apk" | tee apksigner-verify.log

          stage="$RUNNER_TEMP/release-assets"
          mkdir -p "$stage"
          cp "$apk" "$stage/app-release.apk"
          cp "$bundle" "$stage/app-release.aab"
          (cd "$stage" && sha256sum app-release.apk app-release.aab > SHA256SUMS.txt)
          echo 'SHA-256 checksums:'
          cat "$stage/SHA256SUMS.txt"

      - name: Upload release assets as workflow artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ariai-release-assets-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release-assets/app-release.apk
            ${{ runner.temp }}/release-assets/app-release.aab
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with generated notes and assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/app-release.apk
            ${{ runner.temp }}/release-assets/app-release.aab
            ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-logs
          path: |
            validation.log
            release-build.log
            apksigner-verify.log
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 7
