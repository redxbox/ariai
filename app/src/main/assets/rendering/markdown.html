<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; font-src 'self' file: data:; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="stylesheet" href="katex/katex.min.css">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; background: transparent; overflow-wrap: anywhere; }
    body { font: 16px/1.48 sans-serif; color: var(--reply-color, #222); padding: 1px 0 4px; }
    #content > :first-child { margin-top: 0; }
    #content > :last-child { margin-bottom: 0; }
    p { margin: 0 0 0.58em; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 0.85em 0 0.32em; }
    h1 { font-size: 1.2em; } h2 { font-size: 1.12em; } h3 { font-size: 1.06em; }
    ul, ol { margin: 0.25em 0 0.6em; padding-inline-start: 1.35em; }
    li { margin: 0.12em 0; }
    blockquote { margin: 0.45em 0; padding-inline-start: 0.8em; border-inline-start: 3px solid #7a8aa0; opacity: .88; }
    a { color: var(--link-color, #3978e8); text-decoration: underline; }
    pre { margin: 0.5em 0; padding: 0.7em; border-radius: 9px; background: rgba(125, 135, 150, .14); overflow-x: auto; white-space: pre; }
    code { font-family: monospace; font-size: .9em; }
    :not(pre) > code { padding: .08em .28em; border-radius: 4px; background: rgba(125, 135, 150, .16); }
    table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; margin: .45em 0; }
    th, td { border: 1px solid rgba(125, 135, 150, .42); padding: .28em .48em; text-align: start; }
    img { max-width: 100%; }
    .mermaid-box { max-width: 100%; overflow-x: auto; margin: .5em 0; }
    .mermaid-box svg { max-width: 100%; height: auto; }
    .render-error { white-space: pre-wrap; color: #bd3f3f; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: .15em 0; }
    hr { border: 0; border-top: 1px solid rgba(125, 135, 150, .38); margin: .8em 0; }
  </style>
  <script src="vendor/marked.min.js"></script>
  <script src="katex/katex.min.js"></script>
  <script src="katex/auto-render.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="renderer.js"></script>
</head>
<body>
  <main id="content" dir="auto"></main>
</body>
</html>
